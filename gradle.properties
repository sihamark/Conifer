#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# The ios targets cannot be built anywhere but on macOS, so every build on a Linux CI runner warned
# about the simulator test task it had to disable. That the ios tests run on a macOS job of their
# own is the arrangement, not an oversight.
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true