name: Tests

# The targets JaCoCo cannot see. The JVM suite is not repeated here: coverage.yml already runs it
# on every push and pull request as part of :shared:jvmCoverageReport, and running it twice per
# change would only cost time.
#
# Only iosSimulatorArm64 can run tests at all - iosArm64 is device-only and has no test task, and
# the simulator target is disabled on anything but macOS.
#
# The android job does repeat commonTest, which jvmTest already covers - on purpose. It runs against
# the stubbed android.jar rather than a real JDK, which is what catches common code reaching for a
# JVM API that Android does not have. No emulator is involved: withHostTest in shared/build.gradle.
# kts is the local unit test variant, not the instrumented one.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Web (wasmJs)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Karma drives the Firefox that ships with the runner image; the build asks for it headless,
      # so no virtual display is needed here.
      - name: Run the browser tests
        run: ./gradlew :shared:wasmJsBrowserTest --stacktrace

      # Reporting only, and always: a suite that failed is exactly the run whose summary is worth
      # having, and a step that only runs on success would skip it.
      - name: Say how many tests ran
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "Web (wasmJs)" \
            --results shared/build/test-results/wasmJsBrowserTest

      - name: Keep the test results if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-results
          path: |
            shared/build/test-results/wasmJsBrowserTest/
            shared/build/reports/tests/
          retention-days: 14

  android:
    name: Android (host)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run the host tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      # Reporting only, and always: a suite that failed is exactly the run whose summary is worth
      # having, and a step that only runs on success would skip it.
      - name: Say how many tests ran
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "Android (host)" \
            --results shared/build/test-results/testAndroidHostTest

      - name: Keep the test results if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            shared/build/test-results/testAndroidHostTest/
            shared/build/reports/tests/
          retention-days: 14

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native pulls a large toolchain on a cold runner, and it is keyed by the Kotlin
      # version, which is what the version catalog holds.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run the simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # Reporting only, and always: a suite that failed is exactly the run whose summary is worth
      # having, and a step that only runs on success would skip it.
      - name: Say how many tests ran
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "iOS (simulator)" \
            --results shared/build/test-results/iosSimulatorArm64Test

      - name: Keep the test results if they failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            shared/build/test-results/iosSimulatorArm64Test/
            shared/build/reports/tests/
          retention-days: 14
