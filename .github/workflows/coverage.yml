name: Coverage

# Runs the JVM test suite and refreshes the coverage badge in .github/badges.
# Report-only: nothing here fails a build on a coverage number.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The Compose desktop UI tests in jvmTest go through skiko, which wants a display.
      - name: Ensure a virtual display is available
        run: command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Run the JVM tests with coverage
        run: xvfb-run --auto-servernum ./gradlew :shared:jvmCoverageReport --stacktrace

      # Reporting only, and always: a suite that failed is exactly the run whose summary is worth
      # having, and a step that only runs on success would skip it.
      - name: Say how many tests ran
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "JVM tests" \
            --results shared/build/test-results/jvmTest \
            --jacoco-csv shared/build/reports/jacoco/jvmCoverageReport/jvmCoverageReport.csv

      - name: Keep the full report as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: shared/build/reports/jacoco/jvmCoverageReport/
          retention-days: 14

      - name: Generate the badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: shared/build/reports/jacoco/jvmCoverageReport/jvmCoverageReport.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          generate-branches-badge: true

      # The badges live on a branch of their own rather than beside the code. main takes changes
      # only through a pull request - a repository rule, and one worth keeping - so a run cannot
      # commit to it, and the ways around that all end in handing a credential that can write to
      # main to a job that wants to update a number in a readme. Nothing else lives on this branch:
      # two SVGs at its root, which is what the readme links to.
      #
      # Written with git's plumbing rather than by checking the branch out, because the workspace is
      # sitting on main and this has no business disturbing it. Hash the two files into objects,
      # build a tree of exactly those two, commit it onto whatever the branch already points at.
      # Comparing that tree with the published one is also an exact answer to whether the coverage
      # actually moved, which the old check - a diff against files tracked on main - no longer is.
      - name: Publish the badges to the badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          jacoco=$(git hash-object -w .github/badges/jacoco.svg)
          branches=$(git hash-object -w .github/badges/branches.svg)
          tree=$(printf '100644 blob %s\t%s\n' \
            "$jacoco" jacoco.svg "$branches" branches.svg | git mktree)

          parent=""
          if git fetch --depth 1 origin badges; then
            published=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$published^{tree}")" = "$tree" ]; then
              echo "Coverage unchanged, nothing to publish."
              exit 0
            fi
            parent="-p $published"
          else
            echo "No badges branch yet; this run starts it."
          fi

          # Nothing is triggered by a push to this branch - every workflow here watches main, a pull
          # request or a tag - and [skip ci] says so out loud in case one day something does.
          commit=$(git commit-tree "$tree" $parent -m "update coverage badge [skip ci]")
          git push origin "$commit:refs/heads/badges"
